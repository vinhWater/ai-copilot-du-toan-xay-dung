services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: legal
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal  # chỉ chạy local
    ports:
      - "5432:5432"
    volumes:
      - legal-db:/var/lib/postgresql/data
      - ./module_1/tests/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal"]
      interval: 2s
      retries: 15

  legal-api:
    build: ./module_1
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://legal:legal@db:5432/legal
      TEST_DATABASE_URL: postgresql://legal:legal@db:5432/legal_test
      WEBHOOK_URLS: ${WEBHOOK_URLS:-}
    depends_on:
      db:
        condition: service_healthy

  graph-view:
    build:
      context: ./module_1/frontend
      args:
        LEGAL_API_URL: http://legal-api:8000
    ports:
      - "3000:3000"
    depends_on:
      - legal-api

volumes:
  legal-db:
