services:
  legal-api:
    build: ./module_1
    ports:
      - "8000:8000"
    environment:
      CORPUS_PATH: /app/state/corpus.json
      WEBHOOK_URLS: ${WEBHOOK_URLS:-}
    volumes:
      - legal-state:/app/state

  graph-view:
    build:
      context: ./module_1/frontend
      args:
        LEGAL_API_URL: http://legal-api:8000
    ports:
      - "3000:3000"
    depends_on:
      - legal-api

volumes:
  legal-state:
